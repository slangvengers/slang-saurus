<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slang Saurus - Kamus Slang Modern & Gen Z</title>
    <!-- Google Fonts: Poppins & Fredoka untuk kesan lucu dan modern -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #f4fbf7;
            --primary-green: #2d6a4f;
            --mint-light: #d8f3dc;
            --mint-card: #e9f5ed;
            --accent-green: #52b788;
            --text-main: #1b4332;
            --text-muted: #4f772d;
            --white: #ffffff;
            --shadow: rgba(45, 106, 79, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header & Hero Section */
        header {
            background: linear-gradient(135deg, #d8f3dc 0%, #b7e4c7 100%);
            padding: 40px 20px;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 10px 25px var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .hero-container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .dino-mascot {
            width: 110px;
            height: 110px;
            background: var(--white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            box-shadow: 0 8px 20px rgba(45, 106, 79, 0.15);
            font-size: 55px;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        header h1 {
            font-family: 'Fredoka', cursive;
            font-size: 2.8rem;
            color: var(--primary-green);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        header p {
            font-size: 1.05rem;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        /* Search Bar */
        .search-box {
            position: relative;
            max-width: 500px;
            margin: 0 auto;
        }

        .search-box input {
            width: 100%;
            padding: 15px 20px 15px 50px;
            border-radius: 50px;
            border: 2px solid var(--accent-green);
            background: var(--white);
            font-size: 1rem;
            color: var(--text-main);
            outline: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            box-shadow: 0 6px 20px rgba(82, 183, 136, 0.3);
        }

        .search-box i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-green);
            font-size: 1.2rem;
        }

        /* Main Content Layout */
        main {
            max-width: 1100px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1;
        }

        .section-title {
            font-family: 'Fredoka', cursive;
            font-size: 1.5rem;
            color: var(--primary-green);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Loading & Empty State */
        .status-message {
            text-align: center;
            padding: 40px;
            font-size: 1.1rem;
            color: var(--text-muted);
        }

        /* Grid Kartu Slang */
        .slang-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .slang-card {
            background: var(--white);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 6px 20px var(--shadow);
            border: 1px solid #e2f0e6;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .slang-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(45, 106, 79, 0.12);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .slang-term {
            font-family: 'Fredoka', cursive;
            font-size: 1.4rem;
            color: var(--primary-green);
        }

        .slang-category {
            background: var(--mint-light);
            color: var(--primary-green);
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .slang-meaning {
            font-size: 0.95rem;
            color: #333;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .slang-example {
            background: var(--bg-color);
            padding: 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            color: #555;
            border-left: 3px solid var(--accent-green);
            font-style: italic;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 25px;
            background: var(--white);
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid #e2f0e6;
            margin-top: 50px;
        }

        footer span {
            color: #e63946;
        }
    </style>
</head>
<body>

    <!-- Header & Hero -->
    <header>
        <div class="hero-container">
            <div class="dino-mascot">
                🦖
            </div>
            <h1>Slang Saurus</h1>
            <p>Kamus gaul paling update, disusun langsung dari spreadsheet pilihanmu!</p>
            
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Cari kata slang atau artinya di sini..." onkeyup="filterSlang()">
            </div>
        </div>
    </header>

    <!-- Content Area -->
    <main>
        <div class="section-title">
            <i class="fa-solid fa-book-open"></i> Daftar Kosakata Slang
        </div>

        <div id="loading" class="status-message">
            <i class="fa-solid fa-spinner fa-spin"></i> Lagi nyari fosil kata-kata slang dari Spreadsheet...
        </div>

        <div id="slangGrid" class="slang-grid">
            <!-- Data dari Google Sheets akan masuk otomatis lewat JavaScript di sini -->
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>Made with <span>💚</span> by Slang Saurus Team &copy; 2026</p>
    </footer>

    <!-- Script untuk Tarik Data dari Spreadsheet via SheetDB -->
    <script>
        const apiUrl = 'https://sheetdb.io/api/v1/g7sh7xm5hher2';
        let allSlangData = [];

        async function fetchSlangData() {
            const loadingEl = document.getElementById('loading');
            const gridEl = document.getElementById('slangGrid');

            try {
                let response = await fetch(apiUrl);
                allSlangData = await response.json();
                
                loadingEl.style.display = 'none';

                if (allSlangData.length === 0) {
                    gridEl.innerHTML = `<div class="status-message" style="grid-column: 1/-1;">Belum ada kosakata di spreadsheet kamu nih!</div>`;
                    return;
                }

                displaySlangCards(allSlangData);
            } catch (error) {
                console.error("Gagal mengambil data:", error);
                loadingEl.innerHTML = `<span style="color: #e63946;">Gagal memuat data dari spreadsheet. Coba cek koneksi atau format API-nya ya!</span>`;
            }
        }

        function displaySlangCards(data) {
            const gridEl = document.getElementById('slangGrid');
            gridEl.innerHTML = '';

            data.forEach(item => {
                // Membaca kolom persis: Slang, Meaning, Example Sentence, dan kategori (jika ada)
                const term = item.Slang || item.term || 'Tanpa Nama';
                const meaning = item.Meaning || item.meaning || '-';
                const example = item['Example Sentence'] || item.example || '-';
                const category = item.Category || item.category || 'General';

                const card = document.createElement('div');
                card.className = 'slang-card';
                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <span class="slang-term">${term}</span>
                            <span class="slang-category">${category}</span>
                        </div>
                        <div class="slang-meaning">${meaning}</div>
                    </div>
                    <div class="slang-example">"${example}"</div>
                `;
                gridEl.appendChild(card);
            });
        }

        function filterSlang() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allSlangData.filter(item => {
                const term = (item.Slang || item.term || '').toLowerCase();
                const meaning = (item.Meaning || item.meaning || '').toLowerCase();
                return term.includes(keyword) || meaning.includes(keyword);
            });
            displaySlangCards(filtered);
        }

        // Panggil fungsi saat halaman pertama kali dibuka
        fetchSlangData();
    </script>
</body>
</html>
